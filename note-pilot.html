const THEMES={easy:{fog:"#071018",crystal:"#5eead4",accent:"#fde68a",ribbon:"#67e8f9",name:"Dawn Staff"},medium:{fog:"#0b0714",crystal:"#c4b5fd",accent:"#f0abfc",ribbon:"#a78bfa",name:"Violet Hall"},hard:{fog:"#12080a",crystal:"#fdba74",accent:"#facc15",ribbon:"#fb923c",name:"Amber Pit"},expert:{fog:"#14060c",crystal:"#fb7185",accent:"#fef08a",ribbon:"#fb7185",name:"Crimson Finale"}};
const NAMES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const midiToHz=m=>440*Math.pow(2,(m-69)/12);
const hzToMidi=hz=>69+12*Math.log2(hz/440);
const noteLabel=m=>NAMES[((m%12)+12)%12]+(Math.floor(m/12)-1);
const colorForMidi=m=>"hsl("+(((m%12)/12)*360)+" 80% 62%)";
const SAVE="note-pilot-40-v1";
let save={unlocked:1,stars:{},selected:1};
try{const s=JSON.parse(localStorage.getItem(SAVE)||"null");if(s)save=Object.assign(save,s)}catch(e){}
const persist=()=>localStorage.setItem(SAVE,JSON.stringify(save));
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
let W=1,H=1,dpr=1;
function resize(){dpr=Math.min(2,devicePixelRatio||1);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",resize);resize();
const MIN=-6,MAX=6;
const yToScreen=y=>{const t=(y-MIN)/(MAX-MIN);return H*0.82-t*H*0.64};
let phase="menu",level=LEVELS[save.selected-1]||LEVELS[0],theme=THEMES[level.d];
let shipY=0,shipVY=0,dist=0,speed=11,score=0,lives=12,holdMidi=null,holdSec=0,mult=1;
let gates=[],particles=[],floats=[],nextZ=40,hits=0,perfects=0,gateCount=0;
let pitchHz=null,rangeLow=180,rangeHigh=520,observed=new Set(),smoothT=0.5,lastStable=null,lastStableAt=0;
let beatTime=0,invuln=0,shake=0,flash=0,stream=null,audioCtx=null,analyser=null,buf=null,runningMic=false,selfTones=[];
let attract={y:0,target:0,z:0},keys={up:false,down:false};
function announce(hz,dur){const now=performance.now();selfTones.push({hz,until:now+dur*1000+140});selfTones.push({hz:hz*2,until:now+dur*1000+140})}
function isSelf(hz){const now=performance.now();selfTones=selfTones.filter(t=>t.until>now);return selfTones.some(t=>Math.abs(1200*Math.log2(hz/t.hz))<55)}
function tone(freq,dur=0.12,type="sine",gain=0.05){if(!audioCtx)return;announce(freq,dur);const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(0.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(gain,audioCtx.currentTime+0.02);g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur+0.02)}
function detectPitch(b,sr,lo,hi){let rms=0;for(let i=0;i<b.length;i++)rms+=b[i]*b[i];rms=Math.sqrt(rms/b.length);if(rms<0.012)return null;const maxS=b.length>>1,minOff=Math.max(1,Math.floor(sr/hi)),maxOff=Math.min(maxS-1,Math.floor(sr/lo));let best=-1,bestC=0,found=false,last=1;for(let off=minOff;off<=maxOff;off++){let c=0;for(let i=0;i<maxS;i++)c+=Math.abs((b[i]||0)-(b[i+off]||0));c=1-c/maxS;if(c>0.9&&c>last){found=true;if(c>bestC){bestC=c;best=off}}else if(found)break;last=c}return bestC>0.9&&best>0?sr/best:null}
async function startMic(){if(runningMic)return;audioCtx=audioCtx||new AudioContext();if(audioCtx.state==="suspended")await audioCtx.resume();try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:false,channelCount:1}});const src=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=0.15;src.connect(analyser);buf=new Float32Array(analyser.fftSize);runningMic=true}catch(e){console.warn(e)}}
function spawnGate(z){const n=Math.random()<level.multi?(Math.random()<0.35&&level.d!=="easy"?3:2):1;const gap=level.gap;const holes=[];if(n===1)holes.push((Math.random()-0.5)*6);else if(n===2){holes.push(-2.4+Math.random()*1.2,1.6+Math.random()*1.4)}else{holes.push(-3.2,0,3.2)}const slabs=[],floor=MIN-1,ceil=MAX+1,sorted=[...holes].sort((a,b)=>a-b);let cursor=floor;for(const h of sorted){const bot=h-gap/2,top=h+gap/2;if(bot-cursor>0.4)slabs.push({y:(cursor+bot)/2,h:bot-cursor});cursor=top}if(ceil-cursor>0.4)slabs.push({y:(cursor+ceil)/2,h:ceil-cursor});const far=holes[Math.floor(Math.random()*holes.length)];gates.push({z,holes,slabs,gap,passed:false,hasNote:Math.random()<level.col,noteY:far,noteTaken:false})}
function resetRun(){level=LEVELS[save.selected-1]||LEVELS[0];theme=THEMES[level.d];shipY=0;shipVY=0;dist=0;speed=level.speed;score=0;lives=level.lives;holdMidi=null;holdSec=0;mult=1;gates=[];particles=[];floats=[];nextZ=36;hits=0;perfects=0;gateCount=0;invuln=1.2;shake=0;flash=0;beatTime=0;for(let z=28;z<90;z+=18)spawnGate(z);renderStaff()}
function loseNotes(n){const take=Math.min(n,lives);if(take<=0)return;lives-=take;hits++;mult=1;holdSec=0;for(let i=0;i<take;i++){const midi=71-(level.lives-lives-i-1);tone(midiToHz(midi),0.16,"triangle",0.05);particles.push({x:W*0.42,y:yToScreen(shipY),vx:(Math.random()-0.3)*180,vy:-80-Math.random()*120,life:0.9,color:colorForMidi(midi)})}shake=0.6;flash=0.7;if(lives<=0)endRun(false);renderStaff()}
function gainNote(){if(lives>=12)return;lives++;renderStaff();tone(880,0.1,"triangle",0.04)}
function endRun(cleared){phase="result";const stars=!cleared?0:(hits===0&&gateCount&&perfects/gateCount>=0.45?3:hits===0?2:1);if(cleared){save.stars[level.id]=Math.max(save.stars[level.id]||0,stars);if(level.id<40)save.unlocked=Math.max(save.unlocked,level.id+1);persist()}document.getElementById("resultTier").textContent=cleared?"Clear":"Crashed";document.getElementById("resultTitle").textContent=level.name;document.getElementById("resultStars").textContent="★".repeat(stars)+"☆".repeat(3-stars);document.getElementById("resultHint").textContent=cleared?Math.floor(score)+" pts · "+perfects+" perfect · "+hits+" hits":"Lost all harmony notes at "+Math.floor(dist)+"m";document.getElementById("result").classList.remove("hidden");document.getElementById("nextBtn").disabled=!cleared||level.id>=40}
function gradeBeat(){const len=60/level.bpm,p=(beatTime%len)/len,d=Math.min(p,1-p);if(d<0.08){perfects++;return"perfect"}if(d<0.16)return"great";if(d<0.28)return"good";return"off"}
function addFloat(text,color){floats.push({text,y:H*0.42,life:0,color})}
function update(dt){theme=THEMES[level.d];if(runningMic&&analyser){analyser.getFloatTimeDomainData(buf);const hz=detectPitch(buf,audioCtx.sampleRate,Math.max(70,rangeLow*0.7),Math.min(1400,rangeHigh*1.3));const now=performance.now();if(hz&&!isSelf(hz)){pitchHz=hz;lastStable=hz;lastStableAt=now;if(phase==="calibrating"){const m=Math.round(hzToMidi(hz));observed.add(m);rangeLow=Math.min(observed.size===1?hz:rangeLow,hz);rangeHigh=Math.max(observed.size===1?hz:rangeHigh,hz);document.getElementById("calibBig").textContent=noteLabel(m);document.getElementById("calibHint").textContent=observed.size>=6?"Range set. Sound again to start, or press Start.":observed.size+"/6 notes · "+Math.round(rangeLow)+"-"+Math.round(rangeHigh)+" Hz";if(observed.size>=6&&phase==="calibrating"){/* ready */}}}else if(lastStable&&now-lastStableAt<6000&&phase==="playing")pitchHz=lastStable;else pitchHz=null}if(phase==="menu"){attract.z+=level.speed*dt;if(Math.random()<0.01)attract.target=(Math.random()-0.5)*7;attract.y+=(attract.target-attract.y)*(1-Math.exp(-2*dt));return}if(phase!=="playing")return;beatTime+=dt;invuln=Math.max(0,invuln-dt);shake=Math.max(0,shake-dt*1.6);flash=Math.max(0,flash-dt*3);let target=shipY;if(pitchHz){const t=Math.min(1,Math.max(0,(pitchHz-rangeLow)/Math.max(20,rangeHigh-rangeLow)));smoothT+=(t-smoothT)*0.35;target=MIN+smoothT*(MAX-MIN);const m=Math.round(hzToMidi(pitchHz));if(holdMidi===m)holdSec+=dt;else{holdMidi=m;holdSec=0}mult=Math.min(8,1+Math.floor(holdSec/0.7))}else{holdMidi=null;holdSec=0;mult=1;if(keys.up)target+=4;if(keys.down)target-=4}shipVY+=(target-shipY)*8*dt;shipY+=shipVY*dt;if(shipY<MIN){shipY=MIN;shipVY=Math.abs(shipVY)*0.55}if(shipY>MAX){shipY=MAX;shipVY=-Math.abs(shipVY)*0.55}dist+=speed*dt;speed=Math.min(level.speed*1.15,level.speed+dist*0.004);while(nextZ<dist+90){spawnGate(nextZ);nextZ+=Math.max(14,22-level.speed*0.25)}for(const g of gates){if(g.passed)continue;if(dist>g.z+1.4){g.passed=true;const inHole=g.holes.some(h=>Math.abs(shipY-h)<g.gap*0.48);if(inHole){gateCount++;const grade=gradeBeat();let add=10*mult;if(grade==="perfect"){add+=40;addFloat("PERFECT","#fde68a");flash=0.4}else if(grade==="great"){add+=22;addFloat("GREAT","#5eead4")}else if(grade==="good"){add+=10;addFloat("GOOD","#38bdf8")}score+=add}else if(invuln<=0){const miss=Math.max(1,Math.round(Math.min(...g.holes.map(h=>Math.abs(shipY-h)))/1.4));loseNotes(Math.min(4,miss));invuln=0.55}}if(!g.noteTaken&&g.hasNote&&Math.abs(dist-g.z)<1.2&&Math.abs(shipY-g.noteY)<1.1){g.noteTaken=true;gainNote();score+=15*mult;addFloat("+note",theme.accent)}}if(dist>=level.len)endRun(true);for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=240*dt}particles=particles.filter(p=>p.life>0);for(const f of floats)f.life+=dt;floats=floats.filter(f=>f.life<0.9);document.getElementById("score").textContent=Math.floor(score);document.getElementById("lv").textContent=level.id;document.getElementById("bpm").textContent=level.bpm;const hc=document.getElementById("holdChip");if(holdMidi&&mult>1){hc.style.display="";document.getElementById("hold").textContent="x"+mult}else hc.style.display="none"}
function drawShip(x,y){ctx.save();ctx.translate(x,y+Math.sin(performance.now()/220)*3);ctx.fillStyle=theme.crystal;ctx.beginPath();ctx.ellipse(8,0,22,16,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#061018";ctx.beginPath();ctx.ellipse(14,-2,7,6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=theme.accent;ctx.fillRect(-18,-3,16,6);ctx.restore()}
function draw(){ctx.fillStyle=theme.fog;ctx.fillRect(0,0,W,H);ctx.strokeStyle=theme.ribbon;ctx.globalAlpha=0.28;ctx.lineWidth=2;for(let i=-4;i<=4;i++){const y=yToScreen(i*1.4);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y+Math.sin((phase==="playing"?dist:attract.z)*0.05+i)*6);ctx.stroke()}ctx.globalAlpha=1;const camZ=phase==="playing"?dist:attract.z,sx=W*0.38,sy=phase==="playing"?yToScreen(shipY):yToScreen(attract.y);if(shake>0){ctx.save();ctx.translate((Math.random()-0.5)*shake*14,(Math.random()-0.5)*shake*10)}for(const g of gates.length?gates:[{z:camZ+40,holes:[0],slabs:[{y:-4,h:3},{y:4,h:3}],gap:4,hasNote:true,noteY:0,noteTaken:false}]){const x=sx+(g.z-camZ)*18;if(x<-80||x>W+120)continue;for(const s of g.slabs){const gy=yToScreen(s.y),gh=s.h*(H*0.64/12),gw=28;ctx.fillStyle="rgba(10,14,24,.85)";ctx.strokeStyle=theme.crystal;ctx.lineWidth=2;ctx.fillRect(x-gw/2,gy-gh/2,gw,gh);ctx.strokeRect(x-gw/2,gy-gh/2,gw,gh)}for(const h of g.holes){const hy=yToScreen(h),midi=60+Math.round(((h-MIN)/(MAX-MIN))*12);ctx.fillStyle=colorForMidi(midi);ctx.globalAlpha=0.85;ctx.font="700 18px ui-sans-serif";ctx.textAlign="center";ctx.fillText(noteLabel(midi),x,hy+6);ctx.globalAlpha=1;ctx.fillRect(x-18,hy-2,36,3)}if(g.hasNote&&!g.noteTaken){ctx.fillStyle=theme.accent;ctx.beginPath();ctx.arc(x+22,yToScreen(g.noteY),6,0,Math.PI*2);ctx.fill()}}for(let m=60;m<=72;m++){const t=(m-60)/12,y=yToScreen(MIN+t*(MAX-MIN));ctx.strokeStyle=colorForMidi(m);ctx.globalAlpha=0.18;ctx.beginPath();ctx.moveTo(sx-40,y);ctx.lineTo(W,y);ctx.stroke()}ctx.globalAlpha=1;drawShip(sx,sy);for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.ellipse(p.x,p.y,8,5,-0.4,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(const f of floats){ctx.globalAlpha=1-f.life;ctx.fillStyle=f.color;ctx.font="700 22px ui-sans-serif";ctx.textAlign="center";ctx.fillText(f.text,W*0.55,f.y-f.life*40)}ctx.globalAlpha=1;if(shake>0)ctx.restore();if(flash>0.02){ctx.fillStyle="rgba(255,255,255,"+(flash*0.18)+")";ctx.fillRect(0,0,W,H)}ctx.fillStyle=theme.crystal;ctx.globalAlpha=0.35;ctx.fillRect(0,H-8,(phase==="playing"?Math.min(1,dist/level.len):0)*W,4);ctx.globalAlpha=1}
function renderStaff(){const el=document.getElementById("staff");el.innerHTML="";for(let i=0;i<12;i++){const on=i<lives,d=document.createElement("div");d.className="note"+(on?" on":"");d.style.background=on?colorForMidi(60+i):"rgba(255,255,255,.12)";d.style.boxShadow=on?"0 0 6px "+colorForMidi(60+i):"none";el.appendChild(d)}}
renderStaff();
function renderMenu(){level=LEVELS[save.selected-1]||LEVELS[0];theme=THEMES[level.d];document.getElementById("tierLabel").textContent=level.d+" · "+theme.name;document.getElementById("levelName").textContent=level.id+". "+level.name;document.getElementById("levelHint").textContent=level.subtitle+" · "+(save.stars[level.id]?"★".repeat(save.stars[level.id]):"unplayed");const grid=document.getElementById("grid");grid.innerHTML="";for(const L of LEVELS){const c=document.createElement("div");const locked=L.id>save.unlocked;c.className="cell "+L.d+(locked?" locked":"");c.textContent=L.id;if(save.stars[L.id]){const s=document.createElement("div");s.className="stars";s.textContent="★".repeat(save.stars[L.id]);c.appendChild(s)}c.onclick=()=>{if(locked)return;save.selected=L.id;persist();renderMenu()};grid.appendChild(c)}}
renderMenu();
document.getElementById("playBtn").onclick=async()=>{await startMic();phase="calibrating";observed=new Set();rangeLow=180;rangeHigh=520;document.getElementById("menu").classList.add("hidden");document.getElementById("calib").classList.remove("hidden");document.getElementById("calibBig").textContent="-"};
document.getElementById("forceStart").onclick=()=>beginPlay();
document.getElementById("selectBtn").onclick=()=>document.getElementById("grid").classList.toggle("hidden");
document.getElementById("nextBtn").onclick=()=>{if(level.id<40)save.selected=level.id+1;persist();document.getElementById("result").classList.add("hidden");beginPlay()};
document.getElementById("retryBtn").onclick=()=>{document.getElementById("result").classList.add("hidden");beginPlay()};
document.getElementById("menuBtn").onclick=()=>{phase="menu";document.getElementById("result").classList.add("hidden");document.getElementById("menu").classList.remove("hidden");renderMenu()};
function beginPlay(){if(rangeHigh-rangeLow<40){rangeLow=196;rangeHigh=523}document.getElementById("calib").classList.add("hidden");document.getElementById("menu").classList.add("hidden");document.getElementById("result").classList.add("hidden");resetRun();phase="playing";if(audioCtx)tone(523,0.1,"triangle",0.04)}
addEventListener("keydown",e=>{if(e.key==="ArrowUp"||e.key==="w")keys.up=true;if(e.key==="ArrowDown"||e.key==="s")keys.down=true;if(e.key===" "&&phase==="calibrating")beginPlay()});
addEventListener("keyup",e=>{if(e.key==="ArrowUp"||e.key==="w")keys.up=false;if(e.key==="ArrowDown"||e.key==="s")keys.down=false});
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
